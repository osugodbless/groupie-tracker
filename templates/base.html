<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Groupie Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        heading: ['Space Grotesk', 'sans-serif'],
                        body: ['DM Sans', 'sans-serif'],
                    },
                    colors: {
                        neon: {
                            cyan: '#22d3ee',
                            purple: '#a855f7',
                            pink: '#ec4899',
                        }
                    }
                }
            }
        }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.10/dist/htmx.min.js" integrity="sha384-H5SrcfygHmAuTDZphMHqBJLc3FhssKjG7w/CeCpFReSfwBWDTKpkzPP8c+cLsK+V" crossorigin="anonymous"></script>
    <style>
        body { font-family: 'DM Sans', sans-serif; }
        h1, h2, h3, h4, h5, h6 { font-family: 'Space Grotesk', sans-serif; }
        .hx-indicator { display: none; }
        .htmx-request .hx-indicator { display: block; }
        .htmx-request.htmx-settling .hx-indicator { display: none; }
        .skeleton { animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
    </style>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen">
    <nav class="bg-gray-900/80 backdrop-blur-sm border-b border-gray-800 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <a href="/" class="flex items-center gap-2">
                    <span class="text-2xl">🎵</span>
                    <span class="font-heading text-xl font-bold text-neon-cyan">Groupie Tracker</span>
                </a>
                <div class="hidden md:flex items-center gap-6">
                    <a href="/" class="text-gray-300 hover:text-neon-cyan transition-colors">Artists</a>
                    <a href="https://github.com/osugodbless/groupie-tracker" target="_blank" class="text-gray-300 hover:text-neon-cyan transition-colors">GitHub</a>
                </div>
                <button id="mobile-menu-btn" class="md:hidden text-gray-300 hover:text-neon-cyan">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
                    </svg>
                </button>
            </div>
        </div>
        <div id="mobile-menu" class="hidden md:hidden bg-gray-900 border-t border-gray-800">
            <div class="px-4 py-3 space-y-2">
                <a href="/" class="block text-gray-300 hover:text-neon-cyan transition-colors py-2">Artists</a>
                <a href="https://github.com/osugodbless/groupie-tracker" target="_blank" class="block text-gray-300 hover:text-neon-cyan transition-colors py-2">GitHub</a>
            </div>
        </div>
    </nav>
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        {{template "content" .}}
    </main>
    <footer class="bg-gray-900/50 border-t border-gray-800 mt-auto">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6">
            <div class="flex flex-col sm:flex-row items-center justify-between gap-4">
                <p class="text-gray-400 text-sm">&copy; 2026 Godbless. Built with Go + HTMX.</p>
                <a href="https://github.com/osugodbless/groupie-tracker" target="_blank" class="text-neon-cyan hover:text-neon-purple transition-colors text-sm">View on GitHub →</a>
            </div>
        </div>
    </footer>
    <script>
        const menuBtn = document.getElementById('mobile-menu-btn');
        const mobileMenu = document.getElementById('mobile-menu');
        if (menuBtn && mobileMenu) {
            menuBtn.addEventListener('click', () => {
                mobileMenu.classList.toggle('hidden');
            });
        }
    </script>
</body>
</html>
