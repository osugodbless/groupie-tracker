<div id="artistDetails" class="space-y-8">
    <!-- Back Link -->
    <a href="/"
       class="inline-flex items-center gap-2 text-gray-400 hover:text-neon-cyan transition-colors">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
        </svg>
        Back to Artists
    </a>

    <!-- Artist Header -->
    <div class="flex flex-col md:flex-row gap-8 items-start">
        <div class="w-full md:w-1/3">
            <div class="relative group">
                <img src="{{ .Image }}" alt="{{ .Name }}" class="w-full aspect-square object-cover rounded-xl border border-gray-800 group-hover:border-neon-cyan/50 transition-colors">
                <div class="absolute inset-0 rounded-xl bg-gradient-to-t from-gray-950/60 to-transparent"></div>
            </div>
        </div>
        
        <div class="w-full md:w-2/3 space-y-6">
            <div>
                <h1 class="font-heading text-4xl font-bold text-white">{{ .Name }}</h1>
                <div class="flex flex-wrap items-center gap-4 mt-4">
                    <div class="flex items-center gap-2 px-3 py-1.5 bg-gray-900/50 border border-gray-800 rounded-lg">
                        <span class="text-neon-purple">📅</span>
                        <span class="text-gray-300 text-sm">Founded</span>
                        <span class="text-white font-semibold">{{ .CreationYear }}</span>
                    </div>
                    <div class="flex items-center gap-2 px-3 py-1.5 bg-gray-900/50 border border-gray-800 rounded-lg">
                        <span class="text-neon-cyan">💿</span>
                        <span class="text-gray-300 text-sm">First Album</span>
                        <span class="text-white font-semibold">{{ .FirstAlbum }}</span>
                    </div>
                </div>
            </div>

            <!-- Members -->
            <div class="space-y-3">
                <div class="flex items-center gap-2">
                    <span class="text-xl">👥</span>
                    <h3 class="font-heading text-xl font-semibold text-white">Members</h3>
                </div>
                <div class="flex flex-wrap gap-2">
                    {{ range .Members }}
                    <span class="px-3 py-1.5 bg-gray-900/50 border border-gray-800 rounded-lg text-gray-300 text-sm hover:border-neon-purple/50 hover:text-neon-purple transition-colors">
                        {{ . }}
                    </span>
                    {{ end }}
                </div>
            </div>

            <!-- View Tour Dates Button -->
            <div id="button">
                <button
                    hx-get="/artist/{{ .ID }}/tour-data"
                    hx-target="#button"
                    hx-swap="outerHTML"
                    hx-indicator="#tour-loading"
                    class="inline-flex items-center gap-2 px-6 py-3 bg-neon-cyan/10 border border-neon-cyan/30 rounded-xl text-neon-cyan font-semibold hover:bg-neon-cyan/20 hover:border-neon-cyan/50 transition-all duration-300">
                    <span class="hx-indicator hidden">
                        <svg class="animate-spin h-5 w-5" fill="none" viewBox="0 0 24 24">
                            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                        </svg>
                    </span>
                    <span class="hx-not-indicator">View Tour Dates</span>
                    <svg class="w-5 h-5 hx-not-indicator" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 8l4 4m0 0l-4 4m4-4H3"/>
                    </svg>
                </button>
            </div>
            
            <div id="tour-loading" class="hx-indicator">
                <div class="skeleton h-12 bg-gray-800 rounded-xl w-48"></div>
            </div>
        </div>
    </div>
</div>
